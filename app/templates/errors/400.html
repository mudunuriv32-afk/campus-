{% extends "base.html" %}
{% block title %}Bad Request (400) — CampusConnect{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-warning mb-3"><i class="bi bi-exclamation-triangle"></i> 400</div>
    <h2 class="fw-bold mb-3">Bad Request</h2>
    <p class="text-muted lead max-w-500 mx-auto mb-4">
      The server could not understand your request due to invalid syntax or an expired security token.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary-cc">
      <i class="bi bi-house-door me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
